<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
  <div class="container">
    <h1>Dashboard</h1>
    <div class="card">
      <div class="field">
        <label>Link name</label>
        <input id="admName" type="text" placeholder="Campaign name">
      </div>
      <div class="field">
        <label>Redirect URL</label>
        <input id="admUrl" type="url" placeholder="https://example.com" required>
      </div>
      <div class="field">
        <label>Tracking window (minutes)</label>
        <input id="admTrackingWindow" type="number" min="1" max="60" value="10" placeholder="10">
      </div>
      <button id="admCreateBtn">Create Link</button>
      <div id="admCreateResult" class="result"></div>
    </div>
    <div class="card">
      <div class="field">
        <label>Link</label>
        <select id="linkSelect"></select>
      </div>
      <div class="field">
        <button id="exportBtn">Export CSV</button>
        <button id="deleteLinkBtn" class="danger">Delete Link</button>
      </div>
      <div id="map" class="map"></div>
      <table class="table" id="eventsTable">
        <thead>
          <tr>
            <th>Time</th>
            <th>Status</th>
            <th>Lat</th>
            <th>Lng</th>
            <th>Accuracy (m)</th>
            <th>IP</th>
            <th>Photo</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
